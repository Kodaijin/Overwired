services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Postgres listens on 15432 rather than the default 5432. Nothing on the
    # host can collide with a container's own port - each container has its own
    # network namespace - so this buys no safety; it is here so that every port
    # in the stack is above 10000 and a 5432 in any error message can only mean
    # something outside this project.
    command: ["-p", "15432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-paintracker}
      # Deliberately NOT given TZ. Timestamps are stored without a zone and are
      # read back as UTC, so the database must keep writing its CURRENT_TIMESTAMP
      # defaults in UTC. Setting a local zone here would shift them. The app's TZ
      # is what decides how times are read from forms and shown on screen.
    volumes:
      # Named volume => data survives `docker compose down` and container rebuilds.
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to loopback only: the database is reachable from this machine
      # (for migrations and backups) but never from the network.
      - "127.0.0.1:${DB_PORT:-15432}:15432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -p 15432 -U ${POSTGRES_USER:-pain} -d ${POSTGRES_DB:-paintracker}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pain}:${POSTGRES_PASSWORD}@db:15432/${POSTGRES_DB:-paintracker}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required - generate one with `openssl rand -base64 48`}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      # Your local timezone. This is the clock the app reads times as when you
      # type them, and the clock it shows them on.
      TZ: ${TZ:-America/Los_Angeles}
      NODE_ENV: production
      PORT: 13000
      HOSTNAME: 0.0.0.0
    ports:
      # Loopback by default. Put a TLS-terminating reverse proxy in front
      # before changing this to 0.0.0.0 - see the README.
      - "127.0.0.1:${APP_PORT:-13000}:13000"

volumes:
  pgdata:
