# Development stack: PostgreSQL only.
#
#   docker compose -f docker-compose.dev.yml up -d
#   npm run db:migrate
#   npm run dev
#
# The app itself runs on the host so you keep fast refresh. Uses a separate
# volume and port from the production stack so the two can coexist.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-paintracker}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pain} -d ${POSTGRES_DB:-paintracker}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata_dev:
