# Development stack: PostgreSQL only.
#
#   docker compose -f docker-compose.dev.yml up -d
#   npm run db:migrate
#   npm run dev
#
# The app itself runs on the host so you keep fast refresh. Its volume is
# separate from the production stack's, so neither can overwrite the other's
# data - but both publish on DB_PORT, so only one of the two can be up at a
# time. Give this one its own DB_PORT if you want both at once.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Same port as the production stack's database - see docker-compose.yml.
    command: ["-p", "15432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-paintracker}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:15432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -p 15432 -U ${POSTGRES_USER:-pain} -d ${POSTGRES_DB:-paintracker}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata_dev:
